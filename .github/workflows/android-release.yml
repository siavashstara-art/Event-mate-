name: EventMate VIP — Signed APK & AAB Auto-Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g., v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-signed-apk-and-aab:
    name: Build & Sign APK + AAB (GitHub, Myket, Cafe Bazaar)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Auto-Bootstrap Android Project Files (If Missing in Repo)
        run: |
          mkdir -p android/app/src/main/java/com/eventmate/vip
          mkdir -p android/app/src/main/res/values

          if [ ! -f android/settings.gradle ]; then
            cat << 'EOF' > android/settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "EventMateVIP"
          include ':app'
          EOF
          fi

          if [ ! -f android/build.gradle ]; then
            cat << 'EOF' > android/build.gradle
          plugins {
              id 'com.android.application' version '8.3.0' apply false
          }
          EOF
          fi

          if [ ! -f android/gradle.properties ]; then
            cat << 'EOF' > android/gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF
          fi

          if [ ! -f android/app/build.gradle ]; then
            cat << 'EOF' > android/app/build.gradle
          plugins {
              id 'com.android.application'
          }

          def storeFilePath = System.getenv("KEYSTORE_FILE") ?: "../eventmate-release.keystore"
          def storePass = System.getenv("KEYSTORE_PASSWORD") ?: "EventMateVIP2026"
          def aliasName = System.getenv("KEY_ALIAS") ?: "eventmate_vip"
          def keyPass = System.getenv("KEY_PASSWORD") ?: "EventMateVIP2026"
          def apiBaseUrl = System.getenv("EVENTMATE_API_BASE_URL") ?: "https://ais-pre-omeitfmbn6thcwrha6aqzc-453570687245.europe-west2.run.app"

          android {
              namespace "com.eventmate.vip"
              compileSdk 34

              buildFeatures {
                  buildConfig true
              }

              defaultConfig {
                  applicationId "com.eventmate.vip"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0.0"
                  buildConfigField "String", "API_BASE_URL", "\"${apiBaseUrl}\""
                  buildConfigField "String", "SERVER_PROXY_CONCIERGE", "\"${apiBaseUrl}/api/concierge\""
                  buildConfigField "String", "SERVER_PROXY_RATES", "\"${apiBaseUrl}/api/rates\""
                  buildConfigField "String", "SERVER_PROXY_OAUTH_CONFIG", "\"${apiBaseUrl}/api/auth/oauth-config\""
              }

              signingConfigs {
                  release {
                      storeFile file(storeFilePath)
                      storePassword storePass
                      keyAlias aliasName
                      keyPassword keyPass
                      enableV1Signing true
                      enableV2Signing true
                      enableV3Signing true
                  }
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                      shrinkResources false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'androidx.webkit:webkit:1.10.0'
          }
          EOF
          fi

          if [ ! -f android/app/src/main/AndroidManifest.xml ]; then
            cat << 'EOF' > android/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="true"
                  android:hardwareAccelerated="true"
                  android:theme="@style/AppTheme">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          fi

          if [ ! -f android/app/src/main/res/values/strings.xml ]; then
            cat << 'EOF' > android/app/src/main/res/values/strings.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">EventMate VIP | ایونت‌مِیت</string>
          </resources>
          EOF
          fi

          if [ ! -f android/app/src/main/res/values/styles.xml ]; then
            cat << 'EOF' > android/app/src/main/res/values/styles.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="android:Theme.Material.Light.NoActionBar">
                  <item name="android:statusBarColor">#FAF7F2</item>
                  <item name="android:navigationBarColor">#2C1E16</item>
                  <item name="android:windowBackground">#FAF7F2</item>
              </style>
          </resources>
          EOF
          fi

          if [ ! -f android/app/src/main/java/com/eventmate/vip/MainActivity.java ]; then
            cat << 'EOF' > android/app/src/main/java/com/eventmate/vip/MainActivity.java
          package com.eventmate.vip;

          import android.annotation.SuppressLint;
          import android.app.Activity;
          import android.content.Intent;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Bundle;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private WebView webView;

              @SuppressLint("SetJavaScriptEnabled")
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  webView = new WebView(this);
                  webView.setBackgroundColor(Color.parseColor("#FAF7F2"));
                  setContentView(webView);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setLoadWithOverviewMode(true);
                  settings.setUseWideViewPort(true);

                  webView.setWebChromeClient(new WebChromeClient());
                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          Uri uri = request.getUrl();
                          String url = uri.toString();
                          if (url.startsWith("whatsapp://") || url.contains("wa.me") || url.startsWith("tel:")) {
                              try {
                                  startActivity(new Intent(Intent.ACTION_VIEW, uri));
                              } catch (Exception ignored) {}
                              return true;
                          }
                          return false;
                      }
                  });
                  webView.loadUrl(BuildConfig.API_BASE_URL);
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF
          fi

      - name: Generate RSA-2048 Production Keystore
        working-directory: ./android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          rm -f eventmate-release.keystore
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > eventmate-release.keystore
          else
            STORE_PASS="${KEYSTORE_PASSWORD:-EventMateVIP2026}"
            ALIAS_NAME="${KEY_ALIAS:-eventmate_vip}"
            KEY_PASS="${KEY_PASSWORD:-EventMateVIP2026}"
            keytool -genkeypair -v \
              -keystore eventmate-release.keystore \
              -alias "$ALIAS_NAME" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$STORE_PASS" \
              -keypass "$KEY_PASS" \
              -dname "CN=EventMate VIP, OU=FBNM Stage, O=New Metaversity, L=Tehran, S=Tehran, C=IR"
          fi

      - name: Build Signed Release APK & Store AAB via Gradle
        working-directory: ./android
        env:
          SECRET_API_URL: ${{ secrets.EVENTMATE_API_BASE_URL }}
          SECRET_STORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          SECRET_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SECRET_KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          export EVENTMATE_API_BASE_URL="${SECRET_API_URL:-https://ais-pre-omeitfmbn6thcwrha6aqzc-453570687245.europe-west2.run.app}"
          export KEYSTORE_FILE="../eventmate-release.keystore"
          export KEYSTORE_PASSWORD="${SECRET_STORE_PASS:-EventMateVIP2026}"
          export KEY_ALIAS="${SECRET_KEY_ALIAS:-eventmate_vip}"
          export KEY_PASSWORD="${SECRET_KEY_PASS:-EventMateVIP2026}"
          gradle assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Package Store-Ready Signed Outputs (GitHub, Myket, Cafe Bazaar)
        run: |
          mkdir -p release-artifacts
          cp android/app/build/outputs/apk/release/*.apk release-artifacts/EventMate-VIP-v1.0.0-Universal.apk
          cp android/app/build/outputs/apk/release/*.apk release-artifacts/EventMate-VIP-v1.0.0-Myket.apk
          cp android/app/build/outputs/apk/release/*.apk release-artifacts/EventMate-VIP-v1.0.0-CafeBazaar.apk
          cp android/app/build/outputs/bundle/release/*.aab release-artifacts/EventMate-VIP-v1.0.0-StoreBundle.aab
          cd release-artifacts && sha256sum *.apk *.aab > SHA256SUMS.txt

      - name: Upload Signed Store Packages (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: EventMate-VIP-Signed-Packages
          path: release-artifacts/*

      - name: Publish Signed APK & AAB to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || 'v1.0.0' }}
          name: "EventMate VIP | ایونت‌مِیت — نسخه امضاشده (APK + AAB)"
          files: |
            release-artifacts/EventMate-VIP-v1.0.0-Universal.apk
            release-artifacts/EventMate-VIP-v1.0.0-Myket.apk
            release-artifacts/EventMate-VIP-v1.0.0-CafeBazaar.apk
            release-artifacts/EventMate-VIP-v1.0.0-StoreBundle.aab
            release-artifacts/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
