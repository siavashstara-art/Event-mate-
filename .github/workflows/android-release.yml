name: EventMate VIP — Signed APK & AAB Auto-Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-signed-apk-and-aab:
    name: Build & Sign Standalone APK + AAB
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 3. Build React Web App into Android Assets
        run: |
          mkdir -p android/app/src/main/assets/www
          npm install --legacy-peer-deps || npm install
          npm install react-is --legacy-peer-deps || true
          npx vite build --base=./
          cp -r dist/* android/app/src/main/assets/www/
          echo "// Native APK Asset Mode" > android/app/src/main/assets/www/registerSW.js

      - name: 4. Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 5. Accept Android SDK Licenses
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          mkdir -p "$ANDROID_SDK_ROOT/licenses"
          printf "\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n" > "$ANDROID_SDK_ROOT/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd\n504667f4c0de7af1a06de9f4b1727b84351f2910\n" > "$ANDROID_SDK_ROOT/licenses/android-sdk-preview-license"

      - name: 6. Write Android Project Files (Zero-Heredoc Base64)
        run: |
          mkdir -p android/app/src/main/java/com/eventmate/vip
          echo "" | base64 -d > android/settings.gradle
          echo "cGx1Z2lucyB7CiAgICBpZCAiY29tLmFuZHJvaWQuYXBwbGljYXRpb24iIHZlcnNpb24gIjguMy4wIiBhcHBseSBmYWxzZQp9Cg==" | base64 -d > android/build.gradle
          echo "b3JnLmdyYWRsZS5qdm1hcmdzPS1YbXgyMDQ4bSAtRGZpbGUuZW5jb2Rpbmc9VVRGLTgKYW5kcm9pZC51c2VBbmRyb2lkWD10cnVlCmFuZHJvaWQubm9uVHJhbnNpdGl2ZVJDbGFzcz10cnVlCg==" | base64 -d > android/gradle.properties
          echo "" | base64 -d > android/app/build.gradle
          echo "" | base64 -d > android/app/src/main/AndroidManifest.xml
          echo "" | base64 -d > android/app/src/main/java/com/eventmate/vip/MainActivity.java

      - name: 7. Install Gradle 8.7 Direct (Bypass GitHub Cache Outage) & Build APK + AAB
        working-directory: ./android
        run: |
          rm -f eventmate-release.keystore
          keytool -genkeypair -v -keystore eventmate-release.keystore -alias eventmate_vip -keyalg RSA -keysize 2048 -validity 10000 -storepass EventMateVIP2026 -keypass EventMateVIP2026 -dname "CN=EventMate VIP, OU=FBNM, O=EventMate, L=Tehran, S=Tehran, C=IR"
          curl -sL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o gradle.zip
          unzip -q gradle.zip
          ./gradle-8.7/bin/gradle assembleRelease bundleRelease --no-daemon --stacktrace

      - name: 8. Package Signed Outputs
        run: |
          mkdir -p release-artifacts
          cp android/app/build/outputs/apk/release/*.apk release-artifacts/EventMate-VIP-v1.1.0-Universal.apk
          cp android/app/build/outputs/apk/release/*.apk release-artifacts/EventMate-VIP-v1.1.0-Myket.apk
          cp android/app/build/outputs/apk/release/*.apk release-artifacts/EventMate-VIP-v1.1.0-CafeBazaar.apk
          cp android/app/build/outputs/bundle/release/*.aab release-artifacts/EventMate-VIP-v1.1.0-StoreBundle.aab
          ls -lh release-artifacts/

      - name: 9. Publish Direct Download APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0
          name: "EventMate VIP v1.1.0 — نسخه اندروید آفلاین و کامل"
          files: release-artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 10. Upload Signed APK + AAB to Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EventMate-VIP-Signed-Packages
          path: release-artifacts/*
