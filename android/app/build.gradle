plugins {
    id 'com.android.application'
}

// ============================================================================
// 100% Automated Zero-Touch Environment, API Proxy & Keystore Resolver
// Zero manual action required by user:
// 1) Automatically resolves Server Proxy URLs (private API keys stay in server.ts)
// 2) Automatically generates RSA-2048 Release Keystore if not present on disk
// 3) Signs APK (V1+V2+V3) & AAB for GitHub Releases, Myket (مایکت) & Cafe Bazaar (بازارچه/بازار)
// ============================================================================
def getSecureEnvOrProp = { String envKey, String propKey, String fallbackValue ->
    def envVal = System.getenv(envKey)
    if (envVal != null && !envVal.trim().isEmpty()) {
        return envVal.trim()
    }
    if (project.hasProperty(propKey)) {
        def propVal = project.property(propKey)?.toString()?.trim()
        if (propVal != null && !propVal.isEmpty()) {
            return propVal
        }
    }
    return fallbackValue
}

def resolvedStoreFile = file(getSecureEnvOrProp("KEYSTORE_FILE", "RELEASE_STORE_FILE", "../eventmate-release.keystore"))
def resolvedStorePassword = getSecureEnvOrProp("KEYSTORE_PASSWORD", "RELEASE_STORE_PASSWORD", "EventMateVIP2026")
def resolvedKeyAlias = getSecureEnvOrProp("KEY_ALIAS", "RELEASE_KEY_ALIAS", "eventmate_vip")
def resolvedKeyPassword = getSecureEnvOrProp("KEY_PASSWORD", "RELEASE_KEY_PASSWORD", "EventMateVIP2026")

// Self-healing Gradle task: automatically creates the RSA-2048 signing keystore if missing
tasks.register("autoProvisionReleaseKeystore") {
    description = "Automatically generates RSA-2048 production keystore if none exists (Zero Manual Setup)"
    doLast {
        if (!resolvedStoreFile.exists()) {
            println "🔐 [EventMate VIP Auto-Vault] Generating RSA-2048 Release Keystore at: ${resolvedStoreFile.absolutePath}"
            resolvedStoreFile.parentFile.mkdirs()
            exec {
                commandLine(
                    "keytool", "-genkeypair", "-v",
                    "-keystore", resolvedStoreFile.absolutePath,
                    "-alias", resolvedKeyAlias,
                    "-keyalg", "RSA",
                    "-keysize", "2048",
                    "-validity", "10000",
                    "-storepass", resolvedStorePassword,
                    "-keypass", resolvedKeyPassword,
                    "-dname", "CN=EventMate VIP, OU=FBNM Stage, O=New Metaversity, L=Tehran, S=Tehran, C=IR"
                )
            }
        } else {
            println "✅ [EventMate VIP Auto-Vault] Existing Release Keystore verified: ${resolvedStoreFile.name}"
        }
    }
}

android {
    namespace "com.eventmate.vip"
    compileSdk 34

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId "com.eventmate.vip"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        // Automated Server Proxy Endpoints (Private API Keys remain 100% isolated in server.ts)
        def apiBaseUrl = getSecureEnvOrProp(
            "EVENTMATE_API_BASE_URL",
            "EVENTMATE_API_BASE_URL",
            "https://ais-pre-omeitfmbn6thcwrha6aqzc-453570687245.europe-west2.run.app"
        )
        def publicClientId = getSecureEnvOrProp(
            "VITE_GOOGLE_CLIENT_ID",
            "GOOGLE_OAUTH_CLIENT_ID",
            "auto-resolved-via-server-proxy"
        )

        buildConfigField "String", "API_BASE_URL", "\"${apiBaseUrl}\""
        buildConfigField "String", "SERVER_PROXY_CONCIERGE", "\"${apiBaseUrl}/api/concierge\""
        buildConfigField "String", "SERVER_PROXY_RATES", "\"${apiBaseUrl}/api/rates\""
        buildConfigField "String", "SERVER_PROXY_OAUTH_CONFIG", "\"${apiBaseUrl}/api/auth/oauth-config\""
        buildConfigField "String", "PUBLIC_OAUTH_CLIENT_ID", "\"${publicClientId}\""
        buildConfigField "String", "SUPPORTED_MARKETS", "\"GITHUB,MYKET,CAFE_BAZAAR,GOOGLE_PLAY\""
        buildConfigField "String", "SUPPORTED_LANGUAGES", "\"FA,EN,AR,TR,KU,HY,RU\""

        manifestPlaceholders = [
            appHostUrl: apiBaseUrl
        ]
    }

    signingConfigs {
        release {
            storeFile resolvedStoreFile
            storePassword resolvedStorePassword
            keyAlias resolvedKeyAlias
            keyPassword resolvedKeyPassword
            // V1 + V2 + V3 enabled for 100% compatibility with Myket (مایکت), Cafe Bazaar (بازارچه/بازار), and GitHub
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
    }

    // Android App Bundle (.aab) configuration for Cafe Bazaar & Google Play
    bundle {
        language {
            enableSplit = false // Keep all 7 languages (FA, EN, AR, TR, KU, HY, RU) available offline/online
        }
        density {
            enableSplit = true
        }
        abi {
            enableSplit = true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.10.0'
}
